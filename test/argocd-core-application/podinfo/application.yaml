  # roles/production/metrics-server/application.yaml
  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: podinfo
    namespace: psk-system
    finalizers:
      - resources-finalizer.argocd.argoproj.io
  spec:
    project: psk-aws-control-plane-configuration

    sources:
      - repoURL: oci://ghcr.io/stefanprodan/charts/podinfo
        chart: podinfo
        targetRevision: 6.11.2
        helm:
          valueFiles:
            - $config/test/argocd-core-application/podinfo/values.yaml
      - repoURL: https://github.com/twplatformlabs/psk-platform-svc-dist-control-plane-config
        targetRevision: HEAD
        ref: config
    destination:
      server: https://kubernetes.default.svc
      namespace: psk-system
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 5m
